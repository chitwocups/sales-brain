<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InMotion Sales Brain</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    min-height: 100vh;
    background: #0a0a0a !important;
  }

  body {
    background: #0a0a0a;
    color: #f0f0f0;
    font-family: Georgia, serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #password-screen, #app.visible {
    position: fixed !important;
    top: 0; left: 0; right: 0; bottom: 0;
    width: 100vw !important;
    height: 100vh !important;
    overflow: hidden;
  }

  #password-screen {
    position: fixed;
    inset: 0;
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    flex-direction: column;
    gap: 0;
  }

  .login-box {
    background: #0f0f0f;
    border: 1px solid #1e1e1e;
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  .login-logo {
    width: 48px; height: 48px;
    background: linear-gradient(135deg, #e85d26, #f28b3a);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: bold; color: white; font-family: sans-serif;
  }

  .login-title { font-size: 20px; font-weight: 600; color: #f0f0f0; text-align: center; }
  .login-subtitle { font-size: 14px; color: #777; font-family: sans-serif; text-align: center; margin-top: -16px; }

  .login-input {
    width: 100%; background: #141414; border: 1px solid #222; border-radius: 10px;
    color: #f0f0f0; padding: 12px 16px; font-size: 14px; font-family: sans-serif;
    outline: none; transition: border-color 0.2s; text-align: center; letter-spacing: 0.1em;
  }
  .login-input:focus { border-color: #e85d26; }

  .login-btn {
    width: 100%; background: linear-gradient(135deg, #e85d26, #f28b3a);
    border: none; border-radius: 10px; color: white; padding: 12px;
    font-size: 14px; font-family: sans-serif; font-weight: 600; cursor: pointer;
  }
  .login-btn:hover { opacity: 0.9; }
  .login-error { font-size: 14px; color: #ff6b6b; font-family: sans-serif; display: none; }

  #app { display: none; flex-direction: column; }
  #app.visible { display: flex; }

  .header {
    border-bottom: 1px solid #1e1e1e; padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between;
    background: #0d0d0d; flex-shrink: 0;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 32px; height: 32px; background: linear-gradient(135deg, #e85d26, #f28b3a);
    border-radius: 7px; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: bold; color: white; font-family: sans-serif; flex-shrink: 0;
  }
